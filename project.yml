name: QuotaMenu
options:
  bundleIdPrefix: com.quotamenu
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""

targets:
  QuotaMenu:
    type: application
    platform: macOS
    sources:
      - QuotaMenu
    settings:
      base:
        INFOPLIST_FILE: QuotaMenu/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.quotamenu.app
        PRODUCT_NAME: QuotaMenu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: QuotaMenu/QuotaMenu.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true

  QuotaMenuTests:
    type: bundle.unit-test
    platform: macOS
    # Unhosted tests compile the real parser and its model dependencies without
    # launching the menu-bar app or accessing a user's configured accounts.
    sources:
      - QuotaMenuTests
      - QuotaMenu/Services/QuotaService.swift
      - QuotaMenu/Models/QuotaData.swift
      - QuotaMenu/Models/Site.swift
      - QuotaMenu/Utilities/KeychainHelper.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  QuotaMenu:
    build:
      targets:
        QuotaMenu: all
    test:
      targets:
        - QuotaMenuTests
